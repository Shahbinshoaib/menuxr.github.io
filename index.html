    <a-scene
      mindar-image="imageTargetSrc: targets-2.mind; warmupTolerance: 1; missTolerance: 10"

      vr-mode-ui="enabled: false"

      <a-assets>
        <!-- Local files -->
        <img id="bgImage" src="bg2.jpg" />
        <img id="daysImage" src="days.png" />
        <img id="savethedateImage" src="savethedate.jpg" />
        <img id="wishesImage" src="wishes.jpg" />   
        <img id="roundedMask" src="whiteFrame.png" />
        <a-asset-item id="localModel" src="mosque.glb"></a-asset-item>
        <audio
            id="bgAudio"
            src="bgAudio.mp3"
            loop
            preload="auto"
          ></audio>
        
      </a-assets>

      <a-camera
        position="0 0 0"
        look-controls="enabled: false"
        
      ></a-camera>

      <a-entity
        mindar-image-target="targetIndex: 0"
        id="target"

        <a-gltf-model

          position="0 -0.3 1"
          rotation="0 -90 0"
          scale="0.0005 0.0005 0.0005"
        ></a-gltf-model>


      </a-entity>
    </a-scene>

<script>
  const target = document.getElementById('target');
  const startOverlay = document.getElementById('startOverlay');
  const audio = document.getElementById('bgAudio');

  startOverlay.addEventListener('click', async () => {
    try {
      await audio.play(); // 🔓 unlocks audio
    } catch (e) {
      console.log('Audio blocked:', e);
    }

    startOverlay.style.display = 'none';
  });

  target.addEventListener('targetFound', () => {
    audio.play();
  });

  target.addEventListener('targetLost', () => {
    audio.pause();
  });





</script>
