<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    #ui {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: white;
      padding: 8px;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<div id="ui">
  <input id="ytUrl" placeholder="Paste YouTube URL" />
  <button onclick="setVideo()">Load</button>
</div>

<a-scene
  mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

  <a-assets>
    <iframe id="ytVideo" src="" allow="autoplay; encrypted-media"></iframe>
  </a-assets>

  <a-camera look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">
    <a-video
      src="#ytVideo"
      position="0 0 0"
      width="1"
      height="0.56"
      muted="true"
      autoplay="true">
    </a-video>
  </a-entity>

</a-scene>

<script>
  function setVideo() {
    const url = document.getElementById("ytUrl").value;
    const videoId = url.split("v=")[1]?.split("&")[0];
    if (!videoId) return alert("Invalid YouTube URL");

    const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&playsinline=1`;
    document.getElementById("ytVideo").src = embedUrl;
  }
</script>

</body>
</html>
