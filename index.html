<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden">

    <a-scene
      mindar-image="imageTargetSrc: https://your-domain.com/targets/qr-target.mind;"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <!-- Assets -->
      <a-assets>
        <!-- QR reference image (optional visual plane) -->
        <img id="qrImage" src="qr.png" />

        <!-- Dummy 3D models -->
        <a-asset-item id="modelMain" src="models/mainModel.glb"></a-asset-item>
        <a-asset-item id="modelLeft" src="models/sideModelLeft.glb"></a-asset-item>
        <a-asset-item id="modelRight" src="models/sideModelRight.glb"></a-asset-item>
      </a-assets>

      <!-- Camera -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- TARGET -->
      <a-entity mindar-image-target="targetIndex: 0">

        <!-- Optional QR plane -->
        <a-plane
          src="#qrImage"
          position="0 0 0"
          rotation="-90 0 0"
          width="1"
          height="1"
          opacity="0.4">
        </a-plane>

        <!-- MAIN MODEL -->
        <a-gltf-model
          src="#modelMain"
          position="0 0.05 0"
          scale="0.02 0.02 0.02"
          animation="property: position; from: 0 -0.1 0; to: 0 0.05 0; dur: 1000; easing: easeOutBack"
          animation__float="property: position; to: 0 0.08 0; dir: alternate; loop: true; dur: 2000">
        </a-gltf-model>

        <!-- LEFT MODEL -->
        <a-gltf-model
          src="#modelLeft"
          position="-0.15 0.03 0"
          scale="0.015 0.015 0.015"
          animation="property: scale; from: 0 0 0; to: 0.015 0.015 0.015; dur: 800; easing: easeOutElastic">
        </a-gltf-model>

        <!-- RIGHT MODEL -->
        <a-gltf-model
          src="#modelRight"
          position="0.15 0.03 0"
          scale="0.015 0.015 0.015"
          animation="property: scale; from: 0 0 0; to: 0.015 0.015 0.015; dur: 800; easing: easeOutElastic">
        </a-gltf-model>

      </a-entity>

    </a-scene>
  </body>
</html>
