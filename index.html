<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Top Hint -->
  <div class="top-bar">
    <h3>Restaurant Name</h3>
  </div>

  <!-- Scanning UI -->
  <div id="scanning-ui" class="overlay hidden">
    <img src="./Logo1.png" class="logo" />
    <p>Scan the image</p>
  </div>

  <!-- AR Scene -->
  <a-scene
    mindar-image="
      imageTargetSrc: targets2.mind;
      filterBeta: 10;
      warmupTolerance: 1;
      missTolerance: 1;
      uiScanning: #scanning-ui;
      uiLoading: no;
      uiError: no;
    "
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="model1" src="model1.glb"></a-asset-item>
      <a-asset-item id="model2" src="model2.glb"></a-asset-item>
      <a-asset-item id="model3" src="model3.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-plane visible="false" width="1" height="1"></a-plane>

      <a-gltf-model
        id="arModel"
        src="#model1"
        position="0 0.01 0"
        rotation="90 0 0"
        scale="2 2 2">
      </a-gltf-model>

    </a-entity>
  </a-scene>

  <!-- AR Menu UI -->
  <div id="menu-ui" class="menu-ui hidden">
    <div class="menu-card">
      <h2 id="dish-title">Classic Burger</h2>
      <p id="dish-ingredients">
        Beef patty, cheddar cheese, lettuce, tomato, brioche bun
      </p>

      <div class="menu-footer">
        <span id="dish-price">$8.99</span>
        <button onclick="switchModel('#model1')">View</button>
      </div>
    </div>
  </div>

  <!-- Logic -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {

      const sceneEl = document.querySelector('a-scene');
      const menuUI = document.getElementById('menu-ui');
      const model = document.getElementById('arModel');

      sceneEl.addEventListener("targetFound", () => {
        menuUI.classList.remove('hidden');
      });

      sceneEl.addEventListener("targetLost", () => {
        menuUI.classList.add('hidden');
      });

      window.switchModel = (src) => {
        model.setAttribute('animation__out', {
          property: 'scale',
          to: '0 0 0',
          dur: 200,
          easing: 'easeInQuad'
        });

        setTimeout(() => {
          model.setAttribute('src', src);
          model.setAttribute('animation__in', {
            property: 'scale',
            from: '0 0 0',
            to: '2 2 2',
            dur: 300,
            easing: 'easeOutBack'
          });
        }, 220);
      };

    });
  </script>

</body>
</html>
