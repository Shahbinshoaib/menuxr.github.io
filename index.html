<!DOCTYPE html>
<html>
  <head>
    
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <link rel="stylesheet" href="style.css" />

    </head>

  <body>

    <!-- Top Bar -->
    <div class="top-bar">
    <h3>Scan the Image</h3>
    </div>

    <!-- Bottom Controls -->
    <div class="ui">
    <button onclick="switchModel('model1.glb')">Chair</button>
    <button onclick="switchModel('model2.glb')">Table</button>
    <button onclick="switchModel('model3.glb')">Lamp</button>
    </div>

    

    <a-scene
      mindar-image="imageTargetSrc: targets2.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <a-asset-item id="model1" src="model1.glb"></a-asset-item>
        <a-asset-item id="model2" src="model2.glb"></a-asset-item>
        <a-asset-item id="model3" src="model3.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Image Target -->
      <a-entity mindar-image-target="targetIndex: 0">

        <!-- Image surface (debug: set visible=true if needed) -->
        <a-plane
          position="0 0 0"
          rotation="-90 0 0"
          width="1"
          height="1"
          visible="false">
        </a-plane>

        <!-- AR Model -->
        <a-gltf-model
          id="arModel"
          src="#model1"
          position="0 0.01 0"
          rotation="90 0 0"
          scale="2 2 2">
        </a-gltf-model>

      </a-entity>
    </a-scene>

    <!-- Model Switch Logic -->
    <script>
      function switchModel(path) {
        const model = document.querySelector('#arModel');

        model.setAttribute('animation__out', {
          property: 'scale',
          to: '0 0 0',
          dur: 200,
          easing: 'easeInQuad'
        });

        setTimeout(() => {
          model.setAttribute('src', path);

          model.setAttribute('animation__in', {
            property: 'scale',
            from: '0 0 0',
            to: '2 2 2',
            dur: 300,
            easing: 'easeOutBack'
          });
        }, 220);
      }
    </script>

  </body>
</html>
