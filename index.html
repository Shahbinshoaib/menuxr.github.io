<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>

  <body>
    <a-scene
      mindar-image="imageTargetSrc: targets-2.mind; filterMinCF:0.001; filterBeta: 2; warmupTolerance: 1; missTolerance: 10"
      color-space="sRGB"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >

      <a-assets>
        <!-- Local files -->
        <img id="overlay" src="overlay.png" />
        <a-asset-item id="localModel" src="model4.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">

       <a-text
          value="Shahzaib & Zeelaf"
          position="0 0 1.3"
          rotation="90 0 0"
          align="center"
          color="#000000"
          scale="0.5 0.5 0.5"
        ></a-text>

        <a-gltf-model
          src="#localModel"
          position="0 0 0.15"
          rotation="90 0 0"
          scale="0.5 0.5 0.5"
        ></a-gltf-model>

      </a-entity>
    </a-scene>
  </body>
</html>
