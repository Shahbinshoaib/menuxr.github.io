<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>

  <body>
    <a-scene
      mindar-image="imageTargetSrc: targets-2.mind; warmupTolerance: 1; missTolerance: 10"
      color-space="sRGB"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >

      <a-assets>
        <!-- Local files -->
        <img id="bgImage" src="bg2.jpg" />
        <img id="daysImage" src="days.png" />
        <img id="savethedateImage" src="savethedate.jpg" />
        <img id="wishesImage" src="wishes.jpg" />   
        <a-asset-item id="localModel" src="model4.glb"></a-asset-item>
        <video id="video" src="video.mp4" loop></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">

        <a-plane
          src="#bgImage"
          position="0 0.35 -0.2"
          scale="1.3 1.9 1"
          rotation="0 0 0"
        ></a-plane>

         <a-plane
          src="#savethedateImage"
          position="-1.1 0.5 0"
          scale="1 1.5 1"
          rotation="0 35 0"
        ></a-plane>

        <a-plane
          src="#wishesImage"
          position="1.1 0.5 0"
          scale="1 1.5 1"
          rotation="0 -35 0"
        ></a-plane>

        <a-video
          src="#video"
          position="0 1.7 -0.2"
          width="1"
          height="0.6"
          play-on-click
        ></a-video>


      
       <a-text
          value="Shahrukh \n&\n Shahrukh"
          position="0 0.9 0"
          rotation="0 0 0"
          align="center"
          color="#ffffff"
          outline-color="#000000"
          outline-width="1"
          scale="0.7 0.7 0.7"
        ></a-text>

        <a-text
          value="Our Wedding Day"
          position="0 0.7 0"
          rotation="0 0 0"
          align="center"
          color="#ffffff"
          outline-color="#000000"
          outline-width="1"
          scale="0.4 0.4 0.4"
        ></a-text>

        <a-text
          value="Feb 12, 2026"
          position="-1.1 0.5 0.1"
          rotation="0 35 0"
          align="center"
          color="#ffffff"
          outline-color="#000000"
          outline-width="1"
          scale="0.4 0.4 0.4"
        ></a-text>
        
        <a-text
          value="2 Days To Go"
          position="-1.1 -0.2 0.1"
          rotation="0 35 0"
          align="center"
          color="#000000"
          outline-width="0.03"
          scale="0.5 0.5 0.5"
        ></a-text>


        <a-gltf-model
          src="#localModel"
          position="0 -0.5 0.1"
          rotation="0 0 0"
          scale="0.5 0.5 0.5"
        ></a-gltf-model>

      </a-entity>
    </a-scene>
  </body>
</html>
