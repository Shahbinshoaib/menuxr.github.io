<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>


<script>
  
  const video = document.querySelector("#arVideo");
  const target = document.querySelector("#target");

  // 🔑 force WebGL texture refresh
  const forceUpdate = () => {
    video.currentTime = video.currentTime + 0.001;
  };

  document.querySelector("#arVideo").addEventListener("loadeddata", () => {
    document.querySelector("#arVideo").play().then(v => v.pause());
  });

  target.addEventListener("targetFound", async () => {
    try {
      await video.play();
      forceUpdate();
    } catch (e) {
      console.log("Video play blocked:", e);
    }
  });

  target.addEventListener("targetLost", () => {
    video.pause();
    video.currentTime = 0;
  });
</script>


  <body>

    <!-- <div id="startOverlay"
      style="
        position: fixed;
        inset: 0;

    <a-scene
      mindar-image="imageTargetSrc: targets-2.mind; warmupTolerance: 1; missTolerance: 10"
      color-space="sRGB"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >

      <a-assets>
        <!-- Local files -->
        <img id="bgImage" src="calendar.png" />
        <img id="daysImage" src="days.png" />
        <img id="savethedateImage" src="savethedate.jpg" />
        <img id="wishesImage" src="wishes.jpg" />   
        <img id="roundedMask" src="whiteFrame.png" />
        <a-asset-item id="crescent" src="crescent.glb"></a-asset-item>
        <a-asset-item id="stage" src="ramadan_stage.glb"></a-asset-item>
        <a-asset-item id="mubarak" src="ramzanMubarak.glb"></a-asset-item>

        <video
          id="arVideo"
          src="video1.mp4"
          loop
          muted
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>

        <audio
            id="bgAudio"
            src="bgAudio.mp3"
            loop
            preload="auto"
          ></audio>
        
      </a-assets>

      <a-camera
        position="0 0 0"
        look-controls="enabled: false"
        
      ></a-camera>

      <a-entity
        mindar-image-target="targetIndex: 0"
        id="target"
      >


      <!-- <a-plane
        src="#bgImage"

        ></a-plane>
 -->

       <a-video
          src="#arVideo"
          position="0 1.2 -0.05"
          width="1"
          height="0.56"
          material="shader: flat"
          preload="auto"
        ></a-video>


       <a-text
          value="Ramadan\n2026"
          position="0 0.3 0.2"
          rotation="0 0 0"
          align="center"
          color="#ffffff"
          outline-color="#000000"
          outline-width="1"
          scale="0.5 0.5 0.5"

        <!-- <a-text

        <a-text

          rotation="0 0 0"
          align="center"
          color="#ffffff"
          outline-width="0.03"
          scale="0.3 0.3 0.3"
        ></a-text> 


        <a-gltf-model
          src="#stage"
          position="0 -0.4 0.2"
          rotation="0 0 0"

         <a-gltf-model
          src="#mubarak"
