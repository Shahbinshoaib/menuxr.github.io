<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      #ui-container {
        position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
        z-index: 1000; display: flex; gap: 10px;
      }
      button { padding: 10px; border-radius: 8px; border: none; background: white; cursor: pointer; }
    </style>
  </head>
  <body>

    <div id="ui-container">
      <button onclick="switchModel(0)">Model 1</button>
      <button onclick="switchModel(1)">Model 2</button>
      <button onclick="switchModel(2)">Model 3</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets2.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="model1" src="./model1.glb"></a-asset-item>
        <a-asset-item id="model2" src="./model2.glb"></a-asset-item>
        <a-asset-item id="model3" src="./model3.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target-anchor" mindar-image-target="targetIndex: 0">
        <a-gltf-model id="m1" src="#model1" rotation="0 0 0" position="0 0 0" scale="0.5 0.5 0.5"></a-gltf-model>
        <a-gltf-model id="m2" src="#model2" rotation="0 0 0" position="0 0 0" scale="0.5 0.5 0.5" visible="false"></a-gltf-model>
        <a-gltf-model id="m3" src="#model3" rotation="0 0 0" position="0 0 0" scale="0.5 0.5 0.5" visible="false"></a-gltf-model>
      </a-entity>
    </a-scene>

    <script>
      const models = ['m1', 'm2', 'm3'];
      function switchModel(index) {
        models.forEach((id, i) => {
          const el = document.getElementById(id);
          el.setAttribute('visible', i === index);
        });
      }
    </script>
  </body>
</html>
