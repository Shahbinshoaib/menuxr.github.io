<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>

  <body>

    <div id="startOverlay"
      style="
        position: fixed;
        inset: 0;
        background: black;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        z-index: 9999;
      ">
      Tap to Start
    </div>


    <a-scene
      mindar-image="imageTargetSrc: targets-2.mind; warmupTolerance: 1; missTolerance: 10"
      color-space="sRGB"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >

      <a-assets>
        <!-- Local files -->
        <img id="bgImage" src="bg2.jpg" />
        <img id="daysImage" src="days.png" />
        <img id="savethedateImage" src="savethedate.jpg" />
        <img id="wishesImage" src="wishes.jpg" />   
        <a-asset-item id="localModel" src="model4.glb"></a-asset-item>
        <audio
            id="bgAudio"
            src="bgAudio.mp3"
            loop
            preload="auto"
          ></audio>
        
      </a-assets>

      <a-camera
        position="0 0 0"
        look-controls="enabled: false"
        
      ></a-camera>

      <a-entity
        mindar-image-target="targetIndex: 0"
        id="target"
      >


        <a-entity
          geometry="primitive: plane; width: 1.3; height: 1.9"
          material="src: #bgImage; transparent: true"
          position="0 0.35 -0.2"
          rounded="radius: 0.15"
        ></a-entity>


         <a-plane
          src="#savethedateImage"
          position="-1.1 0.5 0"
          scale="1 1.5 1"
          rotation="0 35 0"
        ></a-plane>

        <a-plane
          src="#wishesImage"
          position="1.1 0.5 0"
          scale="1 1.5 1"
          rotation="0 -35 0"
        ></a-plane>


      
       <a-text
          value="Shahr \n&\n Shahrukh"
          position="0 0.9 0"
          rotation="0 0 0"
          align="center"
          color="#ffffff"
          outline-color="#000000"
          outline-width="1"
          scale="0.7 0.7 0.7"
        ></a-text>

        <a-text
          value="Our Wedding Day"
          position="0 0.6 0"
          rotation="0 0 0"
          align="center"
          color="#ffffff"
          outline-color="#000000"
          outline-width="1"
          scale="0.4 0.4 0.4"
        ></a-text>

        <a-text
          value="12\nFeb"
          position="-1.1 0.4 0.1"
          rotation="0 35 0"
          align="center"
          color="#000000"
          outline-width="1"
          scale="0.8 0.8 0.8"
        ></a-text>
        
        <a-text
          value="2 Days To Go"
          position="-1.1 -0.15 0.02"
          rotation="0 35 0"
          align="center"
          color="#000000"
          outline-width="0.03"
          scale="0.5 0.5 0.5"
        ></a-text>


        <a-gltf-model
          src="#localModel"
          position="0 -0.5 0.1"
          rotation="0 0 0"
          scale="0.5 0.5 0.5"
        ></a-gltf-model>


      </a-entity>
    </a-scene>

<script>
  const target = document.getElementById('target');
  const startOverlay = document.getElementById('startOverlay');
  const audio = document.getElementById('bgAudio');

  startOverlay.addEventListener('click', async () => {
    try {
      await audio.play(); // 🔓 unlocks audio
    } catch (e) {
      console.log('Audio blocked:', e);
    }

    startOverlay.style.display = 'none';
  });

  target.addEventListener('targetFound', () => {
    audio.play();
  });

  target.addEventListener('targetLost', () => {
    audio.pause();
  });

  AFRAME.registerComponent('rounded', {
  schema: { radius: { type: 'number', default: 0.1 } },

  init: function () {
    const geometry = new THREE.Shape();
    const r = this.data.radius;
    const w = this.el.getAttribute('geometry').width / 2;
    const h = this.el.getAttribute('geometry').height / 2;

    geometry.moveTo(-w + r, -h);
    geometry.lineTo(w - r, -h);
    geometry.quadraticCurveTo(w, -h, w, -h + r);
    geometry.lineTo(w, h - r);
    geometry.quadraticCurveTo(w, h, w - r, h);
    geometry.lineTo(-w + r, h);
    geometry.quadraticCurveTo(-w, h, -w, h - r);
    geometry.lineTo(-w, -h + r);
    geometry.quadraticCurveTo(-w, -h, -w + r, -h);

    const mesh = new THREE.Mesh(
      new THREE.ShapeGeometry(geometry),
      new THREE.MeshBasicMaterial({
        map: this.el.getObject3D('mesh').material.map,
        transparent: true
      })
    );

    this.el.setObject3D('mesh', mesh);
  }
});



</script>

  




  </body>
</html>
